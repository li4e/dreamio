openapi: 3.1.0
info:
  title: DreamIO API
  version: 1.0.0
  description: Image generation API powered by Flux on ComfyUI

servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Firebase ID token

  schemas:
    Request:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        prompt:
          type: string
        enhancePrompt:
          type: boolean
        finalPrompt:
          type: string
          nullable: true
        model:
          type: string
        modelSettings:
          type: object
          nullable: true
        status:
          $ref: '#/components/schemas/RequestStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        source:
          type: string
          enum: [GPU, FALLBACK]
        cost:
          type: number
        creditSourceType:
          type: string
          enum: [subscription, credit_pack, free_quota]
          nullable: true
        creditSourceId:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/GenerationResult'
        error:
          $ref: '#/components/schemas/RequestError'
        deleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        refundedAt:
          type: string
          format: date-time
          nullable: true

    RequestStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]

    RequestError:
      type: string
      nullable: true
      enum:
        - NSFW_CONTENT_DETECTED
        - GPU_TIMEOUT
        - GPU_UNAVAILABLE
        - GENERATION_FAILED
        - FALLBACK_FAILED
      description: |
        Structured error codes:
        - `NSFW_CONTENT_DETECTED` — safety checker blocked the image
        - `GPU_TIMEOUT` — GPU did not respond in time
        - `GPU_UNAVAILABLE` — no GPU machines available
        - `GENERATION_FAILED` — generic generation failure
        - `FALLBACK_FAILED` — fallback API also failed

    GenerationResult:
      type: object
      properties:
        storageId:
          type: string
        imageUrl:
          type: string

    GenerationSettings:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
          description: 'Allowed: 1024, 1360, 1184, 888, 768'
        height:
          type: integer
          description: 'Allowed: 1024, 768, 888, 1184, 1360'
        seed:
          type: integer
          minimum: -1
        steps:
          type: integer
          minimum: 1
          maximum: 150
        cfg:
          type: number
          minimum: 0
          maximum: 30
        sampler:
          type: string
          enum:
            - euler
            - euler_ancestral
            - heun
            - dpm_2
            - dpm_2_ancestral
            - lms
            - dpmpp_2s_ancestral
            - dpmpp_2m
            - dpmpp_sde
            - dpmpp_2m_sde
            - dpmpp_3m_sde
            - ddpm
            - lcm
            - uni_pc
        scheduler:
          type: string
          enum:
            [
              normal,
              karras,
              exponential,
              sgm_uniform,
              simple,
              ddim_uniform,
              beta,
            ]
        denoise:
          type: number
          minimum: 0
          maximum: 1
        negativePrompt:
          type: string
          minLength: 3
          maxLength: 2000
        checkpoint:
          type: string
          minLength: 1
          maxLength: 200
        loras:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 200
              strengthModel:
                type: number
                minimum: -2
                maximum: 2
                default: 1
              strengthClip:
                type: number
                minimum: -2
                maximum: 2
                default: 1
        inputImageUrl:
          type: string
          format: uri
        inputImageDenoise:
          type: number
          minimum: 0
          maximum: 1
        style:
          type: string
          minLength: 1
          maxLength: 50
        enhance:
          type: boolean

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        isAnonymous:
          type: boolean
        credits:
          type: object
          properties:
            subscription:
              type: object
              nullable: true
              properties:
                planId:
                  type: string
                status:
                  type: string
                available:
                  type: number
                expiresAt:
                  type: string
                  format: date-time
            creditPacks:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  available:
                    type: number
                  total:
                    type: number
            freeQuota:
              type: object
              nullable: true
              properties:
                tokens:
                  type: number
                maxTokens:
                  type: number
                nextRefillAt:
                  type: string
                  format: date-time

    AllowedResolution:
      description: 'Valid width×height pairs: 1024×1024, 1360×768, 1184×888, 888×1184, 768×1360'

    Error:
      type: object
      properties:
        message:
          type: string

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /me:
    get:
      summary: Get current user profile with credit balances
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /prompts/random:
    get:
      summary: Generate a random creative image prompt
      operationId: getRandomPrompt
      security:
        - bearerAuth: []
      parameters:
        - name: language
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
      responses:
        '200':
          description: Generated prompt
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt:
                    type: string
        '429':
          description: Rate limited (max 10/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests:
    get:
      summary: List user's image generation requests
      operationId: listRequests
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: lastUpdatedAt
          in: query
          description: ISO date for cursor-based pagination
          schema:
            type: string
            format: date-time
        - name: lastId
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [before, after]
            default: before
          description: '`before` for pagination, `after` for sync (includes deletedIds)'
      responses:
        '200':
          description: Paginated list of requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Request'
                  deletedIds:
                    type: array
                    items:
                      type: string
                    description: Only present when direction=after
                  lastUpdatedAt:
                    type: string
                    format: date-time
                    nullable: true
                  lastId:
                    type: string
                    nullable: true

    post:
      summary: Create a new image generation request
      operationId: createRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, settings]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 2000
                enhancePrompt:
                  type: boolean
                  default: false
                settings:
                  $ref: '#/components/schemas/GenerationSettings'
      responses:
        '201':
          description: Request created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Invalid request body or unsupported resolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Free user already has an active request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests/{id}:
    get:
      summary: Get a single request by ID
      operationId: getRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '404':
          description: Request not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests/{id}/cancel:
    post:
      summary: Cancel a queued request and refund credits
      operationId: cancelRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '404':
          description: Request not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request is not in QUEUED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /claim:
    post:
      summary: Submit a complaint (unauthenticated)
      operationId: submitClaimPublic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 10
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Claim accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: claim_accepted

  /claim/{requestId}:
    post:
      summary: Submit a complaint for a specific request (authenticated)
      operationId: submitClaimForRequest
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Claim accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: claim_accepted
        '404':
          description: Request not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
